name: Build Windows Executable

on:
  workflow_dispatch: # Allows running this workflow manually from the Actions tab
  release:
    types: [created] # Automatically runs when a new release is published

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies (ffmpeg)
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        # Whisper requires adding its assets (like the tiktoken files) manually if PyInstaller misses them
        # We also need to package the src/ module.
        pyinstaller --noconfirm --onedir --console --add-data "src;src/" main.py

    - name: Zip the application
      run: |
        Compress-Archive -Path dist\main\* -DestinationPath dist\VideoToMarkdown-Windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoToMarkdown-Windows-Executable
        path: dist\VideoToMarkdown-Windows.zip

    - name: Attach to Release (Optional, runs only on Release creation)
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: dist\VideoToMarkdown-Windows.zip
        asset_name: VideoToMarkdown-Windows.zip
        tag: ${{ github.ref }}
        overwrite: true
